<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Baloo 2";src:url(fonts/Baloo2.ttf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;width:1920px;height:1080px}
.ov{position:absolute;left:0;right:0;font-family:"Baloo 2",sans-serif;color:#fff;text-align:center}
#sub{top:40px;display:flex;justify-content:center}
#sub span{max-width:1560px;background:rgba(40,24,10,.78);border-radius:28px;padding:18px 40px 14px;font-size:50px;line-height:1.2;font-weight:700}
#card{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,247,214,.0)}
#card .box{background:#fff7d6;color:#2a1a0c;border:10px solid #7a4b2a;border-radius:48px;padding:40px 90px 34px;box-shadow:0 14px 0 #5a3418}
#card .s{font-size:56px;color:#3fa34d;font-weight:800;line-height:1}
#card .t{font-size:120px;font-weight:800;line-height:1.05;margin-top:10px}
#card .n{font-size:44px;color:#ef5a3c;font-weight:800;margin-top:6px}
</style></head><body>
<!--SVG-->
<div class="ov" id="sub"><span></span></div>
<div class="ov" id="card"><div class="box"><div class="s"></div><div class="t"></div><div class="n"></div></div></div>
<script>
const OFF_L=-260,OFF_R=1860;
const MOUTH={ok:"M-12 0 Q0 12 12 0",sad:"M-12 8 Q0 -4 12 8",wow:"M-5 2 a5 7 0 1 0 10 0 a5 7 0 1 0 -10 0"};
/*EPS*/
const $=id=>document.getElementById(id);
const rnd=(()=>{let s=7;return()=>(s=s*16807%2147483647)/2147483647})();
$("trees").innerHTML=[120,620,820,1500,1180].map((x,i)=>`<use href="#tree" transform="translate(${x} ${640-(i%2)*30}) scale(${.8+rnd()*.5})"/>`).join("");
$("rain").innerHTML=Array.from({length:160},()=>{const x=rnd()*1760-80,y=rnd()*1020-120;return`<line x1="${x}" y1="${y}" x2="${x-10}" y2="${y+30}"/>`}).join("");
$("stars").innerHTML=Array.from({length:40},()=>`<circle cx="${rnd()*1600}" cy="${rnd()*300}" r="${2+rnd()*2}"/>`).join("");
$("fireflies").innerHTML=Array.from({length:18},()=>`<circle cx="${450+rnd()*700}" cy="${420+rnd()*300}" r="${4+rnd()*3}" opacity="${.5+rnd()*.5}"/>`).join("");
const PROPS=["acorn1","nuts","berries","apples","leaf","rainG","flash","rainbow","c1","c2","c3","candles","fireflies"];
const LAYERS={skyStorm:s=>s=="storm",skyEve:s=>s=="eve",sun:s=>s=="day",clouds:s=>s=="day",darkClouds:s=>s=="storm",stars:s=>s=="eve"};
const NUM=["pierwszy","drugi","trzeci","czwarty","piąty"];
const INTRO=4,OUTRO=5;
let E,TL=[],TOTAL=0;
function setup(ep){E=EPS[ep];let t=INTRO;TL=E.s.map(s=>{const d=Math.min(9,Math.max(5,s.t.length*.075+1.4));const r={s,start:t,dur:d};t+=d;return r});TOTAL=t+OUTRO;
document.querySelector("#card .s").textContent="Bajki z Lasu Kropki";document.querySelector("#card .t").textContent=E.t;document.querySelector("#card .n").textContent="Odcinek "+NUM[ep];
const thunder=[],rain=[];TL.forEach(r=>{const on=r.s.on||[];if(on.includes("rainG"))rain.push([r.start,r.start+r.dur]);if(on.includes("flash")){for(let k=Math.floor(r.start/2.6);k*2.6<r.start+r.dur;k++){const tt=k*2.6+2.6*.83;if(tt>=r.start&&tt<r.start+r.dur)thunder.push(tt)}}});
const subs=TL.map(r=>({a:r.start,b:r.start+r.dur,t:r.s.t}));
return{total:TOTAL,thunder,rain,subs}}
const ease=x=>x<0?0:x>1?1:x<.5?2*x*x:1-2*(1-x)*(1-x);
const clamp=x=>Math.max(0,Math.min(1,x));
function idx(t){let i=0;for(let k=0;k<TL.length;k++)if(t>=TL[k].start)i=k;return i}
function setT(t){
const i=idx(t),cur=TL[i],prev=TL[Math.max(0,i-1)];const lt=t-cur.start;const pa=i==0?1:ease(lt/1.8),po=i==0?1:clamp(lt/1.2);
for(const k in LAYERS){const v=+LAYERS[k](cur.s.sky),w=+LAYERS[k](prev.s.sky);$(k).setAttribute("opacity",w+(v-w)*po)}
const on=cur.s.on||[],pon=prev.s.on||[];const op={};
PROPS.forEach(p=>{const v=+on.includes(p),w=+pon.includes(p);op[p]=w+(v-w)*po;$(p).style.opacity=op[p];$(p).setAttribute("opacity",op[p])});
for(const k in cur.s.c){const[x,y,fl,mood,anim]=cur.s.c[k];const[px,py]=prev.s.c[k];const X=px+(x-px)*pa,Y=py+(y-py)*pa;
$(k).setAttribute("transform",`translate(${X} ${Y}) scale(${fl} 1)`);
let dx=0,dy=-6*(.5-.5*Math.cos(2*Math.PI*t/2.2));if(anim=="jump")dy=-34*Math.abs(Math.sin(Math.PI*t/1.2));if(anim=="shake"){dx=3*Math.sin(2*Math.PI*t/.36);dy=0}
$(k+"b").setAttribute("transform",`translate(${dx} ${dy})`);$(k).querySelector(".m").setAttribute("d",MOUTH[mood])}
const kf=(t/.5)%1;$("rain").setAttribute("transform",`translate(${-20*kf} ${60*kf})`);
const ph=(t/2.6)%1;let f=0;if(ph>=.83&&ph<.86)f=1;else if(ph>=.86&&ph<.88)f=.2;else if(ph>=.88&&ph<.9)f=1;$("flash").setAttribute("opacity",f*op.flash);$("flash").style.opacity=f*op.flash;
document.querySelectorAll(".flame").forEach((e,j)=>{const s=.9+.1*Math.sin(t*20+j);e.setAttribute("ry",12*s)});
const card=$("card");let co=0;if(t<INTRO)co=1-clamp((t-(INTRO-.6))/.6);else if(t>TOTAL-OUTRO)co=clamp((t-(TOTAL-OUTRO))/.6);
card.style.opacity=co;if(t>TOTAL-OUTRO){document.querySelector("#card .s").textContent="Bajki z Lasu Kropki";document.querySelector("#card .t").textContent="Koniec!";document.querySelector("#card .n").textContent="Do zobaczenia w kolejnej bajce"}
else{document.querySelector("#card .t").textContent=E.t;document.querySelector("#card .n").textContent="Odcinek "+NUM[EPS.indexOf(E)]}
const sub=$("sub");if(t>=INTRO&&t<TOTAL-OUTRO){sub.style.opacity=clamp((t-cur.start)/.3);sub.firstElementChild.textContent=cur.s.t}else sub.style.opacity=0;
}
window.setup=setup;window.setT=setT;
</script></body></html>
