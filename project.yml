name: CoinRush
options:
  bundleIdPrefix: com.twojafirma
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CoinRush:
    type: application
    platform: iOS
    sources:
      - path: CoinRush
    info:
      path: CoinRush/Info.plist
      properties:
        CFBundleDisplayName: Coin Rush
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twojafirma.coinrush
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""   # <- wpisz swój Team ID z developer.apple.com
schemes:
  CoinRush:
    build:
      targets:
        CoinRush: all
    run:
      config: Debug
      storeKitConfiguration: CoinRush.storekit
    archive:
      config: Release
