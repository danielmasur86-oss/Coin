<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd6ea" />
  <title>Coin Rush 3D – Bajkogród</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="pill"><span id="hud-dist">0</span> m</div>
      <div class="pill gold">🪙 <span id="hud-coins">0</span></div>
      <button id="btn-pause" class="icon-btn" aria-label="Pauza">❚❚</button>
    </div>
    <div class="powers">
      <div class="power" id="pw-magnet"><span>🧲</span><i></i></div>
      <div class="power" id="pw-shield"><span>🛡️</span><i></i></div>
    </div>
    <div id="chapter-banner" class="chapter-banner hidden">
      <img id="cb-img" alt="" />
      <div><b id="cb-title"></b><span id="cb-line"></span></div>
    </div>
    <div id="hint" class="hint">Przesuń palcem ← → aby zmienić pas<br/>↑ skok · ↓ szybkie lądowanie</div>
  </div>

  <!-- MENU -->
  <div id="menu" class="screen">
    <div class="topbar">
      <div class="pill gold big">🪙 <span class="coins">0</span></div>
      <button class="pill plus" data-open="shop" data-tab="coins">＋</button>
    </div>
    <div class="logo">
      <div class="logo-1">COIN</div>
      <div class="logo-2">RUSH 3D</div>
      <div class="logo-3">✨ Bajkogród ✨</div>
    </div>
    <div class="menu-spacer"></div>
    <div class="hero-name" id="hero-name">Kuba</div>
    <div class="diff" id="diff">
      <button data-diff="easy">🙂 Łatwy</button>
      <button data-diff="medium">😎 Średni</button>
      <button data-diff="hard">🔥 Trudny</button>
    </div>
    <div class="best">Rekord: <b id="best">0</b> m · <span id="story-progress"></span></div>
    <button id="btn-play" class="btn primary huge">GRAJ</button>
    <div class="row">
      <button class="btn" data-open="shop" data-tab="chars">🦸 Postacie</button>
      <button class="btn" data-open="shop" data-tab="skins">🔮 Kule</button>
      <button class="btn" data-open="shop" data-tab="upgrades">⚡ Ulepsz</button>
    </div>
    <div class="row">
      <button class="btn gold-btn" data-open="shop" data-tab="coins">🛒 Sklep</button>
      <button class="btn" id="btn-daily">🎁 Nagroda <span id="daily-dot" class="dot hidden"></span></button>
    </div>
    <div class="row links">
      <button id="btn-story" class="link">📖 Historia</button>
      <button id="btn-settings" class="link">⚙️ Ustawienia</button>
    </div>
  </div>

  <!-- PAUZA -->
  <div id="pause" class="screen hidden dim">
    <h2>Pauza</h2>
    <button id="btn-resume" class="btn primary huge">WZNÓW</button>
    <button id="btn-quit" class="btn">Menu główne</button>
  </div>

  <!-- KONIEC GRY -->
  <div id="over" class="screen hidden dim">
    <h2>Ojej! Bum!</h2>
    <div class="stats">
      <div><small>Dystans</small><b id="ov-dist">0</b></div>
      <div><small>Monety</small><b id="ov-coins">0</b></div>
    </div>
    <div id="ov-chapter" class="ov-chapter"></div>
    <div id="ov-record" class="record hidden">🏆 NOWY REKORD!</div>
    <div id="continue-box">
      <button id="btn-continue" class="btn primary huge">▶ KONTYNUUJ <small>🪙 <span id="cont-cost">150</span></small></button>
      <div class="timer"><i id="cont-timer"></i></div>
    </div>
    <div class="row">
      <button id="btn-again" class="btn">↻ Jeszcze raz</button>
      <button id="btn-menu" class="btn">Menu</button>
    </div>
    <button id="ov-double" class="promo hidden" data-buy="double_coins">⚡ Zdobywaj podwójne monety na zawsze → <span class="price" data-price="double_coins"></span></button>
  </div>

  <!-- SKLEP -->
  <div id="shop" class="screen hidden dim panel-screen">
    <div class="panel">
      <div class="panel-head">
        <div class="pill gold">🪙 <span class="coins">0</span></div>
        <button class="icon-btn" data-close aria-label="Zamknij">✕</button>
      </div>
      <div class="tabs">
        <button data-tab="coins">Sklep</button>
        <button data-tab="chars">Postacie</button>
        <button data-tab="skins">Kule</button>
        <button data-tab="upgrades">Ulepsz</button>
      </div>
      <div class="tab-body" id="tab-coins"></div>
      <div class="tab-body" id="tab-chars"></div>
      <div class="tab-body" id="tab-skins"></div>
      <div class="tab-body" id="tab-upgrades"></div>
    </div>
  </div>

  <!-- HISTORIA -->
  <div id="story" class="screen hidden dim">
    <div class="story-card">
      <img id="st-img" alt="" />
      <div class="st-name" id="st-name"></div>
      <p id="st-text"></p>
      <div class="st-dots" id="st-dots"></div>
      <div class="row">
        <button id="st-skip" class="btn">Pomiń</button>
        <button id="st-next" class="btn primary">Dalej ▶</button>
      </div>
    </div>
  </div>

  <!-- FINAŁ -->
  <div id="victory" class="screen hidden dim">
    <div class="story-card">
      <div class="trophy">🏆</div>
      <h2>Bajkogród odczarowany!</h2>
      <p id="vic-text"></p>
      <button id="vic-ok" class="btn primary huge">JEDŹ DALEJ ▶</button>
    </div>
  </div>

  <!-- NAGRODA DZIENNA -->
  <div id="daily" class="screen hidden dim panel-screen">
    <div class="panel">
      <div class="panel-head"><h3>Nagroda dzienna</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="days" id="days"></div>
      <button id="btn-claim" class="btn primary huge">ODBIERZ</button>
    </div>
  </div>

  <!-- USTAWIENIA -->
  <div id="settings" class="screen hidden dim panel-screen">
    <div class="panel">
      <div class="panel-head"><h3>Ustawienia</h3><button class="icon-btn" data-close>✕</button></div>
      <label class="setting"><span>Dźwięk</span><input type="checkbox" id="set-sound" /></label>
      <label class="setting"><span>Wibracje</span><input type="checkbox" id="set-haptics" /></label>
      <label class="setting"><span>Wysoka jakość grafiki</span><input type="checkbox" id="set-quality" /></label>
      <button id="btn-restore" class="btn">Przywróć zakupy</button>
      <a class="link" href="privacy.html" target="_blank">Polityka prywatności</a>
      <p class="ver">Coin Rush 3D v1.0.0</p>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="busy" class="busy hidden"><div class="spinner"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
