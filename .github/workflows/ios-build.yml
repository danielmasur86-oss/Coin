name: iOS build

on:
  push:
    paths-ignore: ['CoinRush3D/**', '.github/workflows/android.yml']
  pull_request:
    paths-ignore: ['CoinRush3D/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project CoinRush.xcodeproj \
            -scheme CoinRush \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
