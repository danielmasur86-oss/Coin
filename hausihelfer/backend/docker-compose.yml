# Simplest production setup on one server (e.g. Hetzner Cloud in Germany):
#   cp .env.example .env   # fill in the values
#   docker compose up -d
# Put a TLS proxy in front (Caddy below gives free HTTPS certificates automatically).
services:
  api:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/hausihelfer.db
    volumes:
      - data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${API_DOMAIN:-api.example.de} --to api:8080
    volumes:
      - caddy:/data
    restart: unless-stopped
    depends_on: [api]

volumes:
  data:
  caddy:
